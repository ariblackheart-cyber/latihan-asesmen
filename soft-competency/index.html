<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Latihan Soft Competency</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f5f2; --card:#fff; --ink:#18201d; --muted:#5f6b66; --line:#e2e6e1;
    --accent:#0f5e57; --accent-soft:#e1efec; --warm:#c8661b; --warm-soft:#fbeee2;
    --ok:#1d7f48; --ok-soft:#e3f4e9; --mid:#a8740c; --mid-soft:#fbf2dc; --bad:#b9402c; --bad-soft:#fae7e3;
    --radius:16px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:620px;margin:0 auto;padding:16px 16px 90px}
  .top{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
  .top h1{font-size:19px;margin:0;font-weight:800;letter-spacing:-.01em}
  .top .back{border:0;background:var(--card);border:1px solid var(--line);width:36px;height:36px;border-radius:10px;font-size:18px;cursor:pointer;color:var(--ink)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:12px}
  .label{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 10px}
  .muted{color:var(--muted)}
  .small{font-size:13px}
  p{line-height:1.55}
  h2{font-size:18px;margin:0 0 6px;letter-spacing:-.01em}
  h3{font-size:16px;margin:0 0 4px}
  .btn{display:block;width:100%;border:0;font:inherit;font-weight:700;font-size:15px;padding:14px;border-radius:13px;cursor:pointer;background:var(--accent);color:#fff;text-align:center}
  .btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
  .btn.warm{background:var(--warm)}
  .btn[disabled]{opacity:.45;cursor:default}
  .row{display:flex;gap:10px} .row>*{flex:1}
  .hidden{display:none !important}
  .pill{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
  .pill.warm{background:var(--warm-soft);color:var(--warm)}
  .pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.mid{background:var(--mid-soft);color:var(--mid)} .pill.bad{background:var(--bad-soft);color:var(--bad)}

  /* bottom nav */
  nav.bottom{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:10;padding-bottom:env(safe-area-inset-bottom)}
  nav.bottom .in{display:flex;max-width:620px;width:100%}
  nav.bottom button{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:10.5px;font-weight:600;color:var(--muted);padding:9px 2px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
  nav.bottom button svg{width:22px;height:22px}
  nav.bottom button.on{color:var(--accent)}

  /* home */
  .hero{background:linear-gradient(135deg,#0f5e57,#14786f);color:#fff;border:0}
  .hero p{color:#d6ebe7;margin:6px 0 0;font-size:14px}
  .hero h2{color:#fff}
  .comp{display:flex;gap:12px;align-items:center;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;cursor:pointer;margin-bottom:9px}
  .comp .ic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0}
  .comp .tx{flex:1;min-width:0}
  .comp .nm{font-weight:700;font-size:15px}
  .comp .sb{font-size:12.5px;color:var(--muted);margin-top:2px}
  .comp.focus{border-color:var(--warm)}
  .mbar{height:5px;background:#e9ece8;border-radius:99px;overflow:hidden;margin-top:7px}
  .mbar i{display:block;height:100%;background:var(--accent);border-radius:99px}

  /* materi */
  .kb{border-top:1px solid var(--line);padding:13px 0}
  .kb:first-of-type{border-top:0;padding-top:4px}
  .kb .h{display:flex;gap:10px}
  .kb .n{width:24px;height:24px;border-radius:7px;background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:12.5px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
  .kb .t{font-weight:700;font-size:14.5px}
  .kb .en{font-size:12.5px;color:var(--muted);font-style:italic}
  .kb .d{font-size:14px;margin:6px 0 0 34px;line-height:1.5}
  .kb .ex{font-size:13.5px;margin:8px 0 0 34px;background:#f4f7f5;border-left:3px solid var(--accent);padding:8px 10px;border-radius:0 8px 8px 0;line-height:1.45}
  .seg{display:flex;background:#e9ece8;border-radius:12px;padding:4px;margin-bottom:12px;overflow-x:auto}
  .seg button{flex:1;border:0;background:none;font:inherit;font-size:13px;font-weight:600;color:var(--muted);padding:8px 8px;border-radius:9px;cursor:pointer;white-space:nowrap}
  .seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.07)}

  /* quiz */
  .qmeta{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}
  .qtext{font-size:16.5px;font-weight:600;line-height:1.5;margin:0}
  .opts{display:grid;gap:9px;margin-top:14px}
  .opt{border:1.5px solid var(--line);background:var(--card);text-align:left;font:inherit;font-size:14.5px;padding:13px 14px;border-radius:12px;cursor:pointer;color:var(--ink);line-height:1.45}
  .opt .why{display:block;font-size:13px;color:var(--muted);margin-top:6px}
  .opt.correct{border-color:var(--ok);background:var(--ok-soft)}
  .opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
  .opt[disabled]{cursor:default}
  .ropt{display:flex;gap:12px;align-items:flex-start}
  .rbadge{flex-shrink:0;width:30px;height:30px;border-radius:9px;border:1.5px dashed #c9cfc9;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:var(--muted)}
  .opt.ranked{border-color:var(--accent);background:#f3f9f8}
  .opt.ranked .rbadge{background:var(--accent);border:0;color:#fff}
  .rres{display:flex;gap:10px;align-items:center;margin-top:8px;font-size:12.5px;font-weight:700}
  .rres .pts{margin-left:auto}
  .passage{background:#f6f7f4;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:14.5px;line-height:1.55}
  .passage ul.clues{margin:6px 0 0;padding-left:18px}
  .passage ul.clues li{margin:3px 0}
  .passage p.read{margin:0}
  .series{font-size:22px;font-weight:700;letter-spacing:.02em;margin-top:10px;line-height:1.5}
  .figq{display:flex;justify-content:center;padding:12px 0 2px}
  .fopts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .fopt{display:flex;align-items:center;justify-content:center;position:relative;padding:10px}
  .flab{position:absolute;top:7px;left:9px;font-weight:800;font-size:13px;color:var(--muted)}
  .tbar{height:4px;background:#e9ece8;border-radius:99px;overflow:hidden;margin:-4px 0 12px}
  .tbar i{display:block;height:100%;width:100%;background:var(--accent);transition:width .2s linear}
  .fb{border-radius:12px;padding:13px 15px;margin-top:12px;font-size:14px;line-height:1.5}
  .fb.ok{background:var(--ok-soft)} .fb.bad{background:var(--bad-soft)}
  .fb b.h{display:block;font-size:15px;margin-bottom:3px}
  .fb.ok b.h{color:var(--ok)} .fb.bad b.h{color:var(--bad)}
  .progress{height:6px;background:#e3e7e2;border-radius:99px;overflow:hidden;margin-bottom:12px}
  .progress i{display:block;height:100%;background:var(--accent);transition:width .3s}

  /* star */
  .field{margin-bottom:12px}
  .field label{display:flex;gap:8px;align-items:baseline;font-weight:700;font-size:14px;margin-bottom:5px}
  .field label span{font-weight:500;font-size:12.5px;color:var(--muted)}
  textarea,input[type=text]{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:11px 12px;font:inherit;font-size:15px;color:var(--ink);background:#fff;resize:vertical}
  textarea:focus,input:focus{outline:none;border-color:var(--accent)}
  .letter{display:inline-flex;width:22px;height:22px;border-radius:6px;background:var(--accent);color:#fff;font-size:12px;align-items:center;justify-content:center}
  .qcard{border:1.5px solid var(--line);border-radius:12px;padding:12px 13px;margin-bottom:8px;cursor:pointer;background:#fff;font:inherit;text-align:left;width:100%;color:var(--ink);font-size:14.5px;line-height:1.45}
  .qcard.on{border-color:var(--accent);background:var(--accent-soft)}
  .evalkb{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.45}
  .evalkb:first-child{border-top:0}
  .evalkb .st{flex-shrink:0;width:74px}
  .score{display:flex;align-items:center;gap:14px}
  .score .big{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1}
  .score .big small{font-size:18px;color:var(--muted)}
  ul.clean{margin:6px 0 0;padding-left:18px;font-size:14px;line-height:1.55}
  .check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line);font-size:14px;cursor:pointer}
  .check:first-child{border-top:0}
  .check input{margin-top:3px;width:18px;height:18px;accent-color:var(--accent)}
  .spinner{display:inline-block;width:16px;height:16px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-3px;margin-right:8px}
  .spinner.dark{border-color:rgba(15,94,87,.25);border-top-color:var(--accent)}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* chat */
  .chat{display:flex;flex-direction:column;gap:9px;margin-bottom:12px}
  .msg{max-width:86%;padding:10px 13px;border-radius:14px;font-size:14.5px;line-height:1.5;white-space:pre-wrap}
  .msg.them{background:var(--card);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
  .msg.me{background:var(--accent);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
  .msg .who{display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:2px}
  .composer{display:flex;gap:8px;align-items:flex-end}
  .composer textarea{flex:1;min-height:46px;max-height:140px}
  .composer .btn{width:auto;padding:12px 16px}
  .notice{font-size:13px;background:var(--mid-soft);color:#6d4c08;padding:10px 12px;border-radius:10px;line-height:1.45}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav class="bottom"><div class="in" id="nav"></div></nav>

<script>
// ===================== DATA =====================
const COMP = [
 {id:"gc", name:"Gaining Commitment", idn:"Mendapatkan komitmen", color:"#c8661b", focus:true,
  def:"Menggunakan teknik dan gaya interpersonal yang sesuai untuk membuat orang lain menerima suatu gagasan atau rencana; menyesuaikan perilaku dengan tugas, situasi, maupun orang lain yang terlibat.",
  kb:[
   ["Membuka diskusi dengan efektif","Opens discussion effectively","Menjelaskan harapan, tujuan, atau permintaan dengan cara yang jelas dan menarik.","Membuka rapat dengan: \"Hari ini kita sepakati jadwal pengecekan meter transaksi, supaya susut di penghantar ini bisa turun.\""],
   ["Mengembangkan gagasan orang lain dan diri sendiri","Develops others' and own ideas","Menyampaikan gagasan pribadi; meminta dan mengembangkan saran dari orang lain; membuat saran atau usulan.","Menyampaikan usulan sendiri, lalu bertanya \"Menurut Bapak bagian mana yang perlu disesuaikan?\" dan mengembangkan saran itu menjadi rencana."],
   ["Mengelola hubungan","Maintain relationships","Membangun hubungan interpersonal yang baik dengan cara membuat orang lain merasa bernilai, dihargai dan dilibatkan dalam diskusi (meningkatkan harga diri, berempati, melibatkan, terbuka, memberi dukungan).","Mengapresiasi pengalaman teknisi senior: \"Bapak paling paham kondisi lapangan, saya butuh masukan Bapak.\""],
   ["Memperjelas situasi saat ini","Clarifies current situation","Mencari, memberikan dan merangkum informasi; memastikan orang lain dapat memahami situasi atau isu yang dihadapi.","Menunjukkan tren susut 3 bulan terakhir, lalu bertanya untuk memastikan semua peserta memahami masalahnya."],
   ["Mendorong terjadinya kesepakatan","Encourages mutual agreement","Menggunakan strategi yang sesuai untuk mempengaruhi orang lain (misalnya menunjukkan keuntungan atau memberi penghargaan); gigih menggunakan berbagai pendekatan untuk mendapatkan kesepakatan.","Menunjukkan manfaat program bagi KPI unit mitra, dan menawarkan jadwal alternatif ketika usulan pertama ditolak."],
   ["Menutup diskusi dengan ringkasan yang jelas","Closes discussion with clear summary","Merangkum hasil diskusi dan menetapkan langkah tindak lanjut jika diperlukan.","Menutup rapat: \"Jadi kita sepakat: pengecekan tiap Senin, PIC Pak Andi, laporan pertama tanggal 20.\""]
  ],
  star:["Ceritakan pengalaman ketika Anda harus meyakinkan pihak yang awalnya menolak gagasan atau rencana Anda.",
        "Ceritakan saat Anda memimpin diskusi antar unit/bagian untuk mencapai kesepakatan.",
        "Ceritakan saat Anda harus mengajak atasan atau rekan senior mendukung perubahan cara kerja."]},
 {id:"ad", name:"Adaptability", idn:"Kemampuan beradaptasi", color:"#2b6cb0",
  def:"Secara efektif mengelola perubahan lingkungan; mengambil tindakan segera untuk menjawab tantangan perubahan; termasuk tantangan bisnis, teknologi, dan lainnya.",
  kb:[
   ["Mencoba memahami perubahan","Understands change","Mencoba memahami perubahan dalam tugas, situasi dan lingkungan kerja sesuai logika atau dasarnya; aktif mencari informasi mengenai situasi kerja yang baru.","Mencari tahu alasan penggantian aplikasi pelaporan gangguan dan bertanya ke tim TI tentang fitur barunya."],
   ["Menyikapi perubahan dengan pikiran positif","Responds change in a positive manner","Memperlakukan perubahan sebagai kesempatan belajar atau berkembang; fokus pada aspek yang menguntungkan; membicarakan perubahan secara positif kepada orang lain.","Menyebut reorganisasi sebagai kesempatan belajar bidang baru dan menceritakan sisi positifnya ke rekan yang cemas."],
   ["Menyesuaikan perilaku","Adjusts behavior","Cepat dan efektif memodifikasi perilaku menghadapi perubahan; siap mencoba pendekatan baru; tidak mempertahankan perilaku yang tidak efektif.","Meninggalkan pencatatan manual yang sering salah dan beralih ke metode inspeksi berbasis aplikasi."],
   ["Bertindak mandiri","Takes independent actions","Menerapkan gagasan atau pemecahan baru tanpa diminta; tidak menunggu perintah orang lain untuk bertindak.","Memperbaiki format checklist inspeksi yang membingungkan tanpa menunggu diminta atasan."],
   ["Melakukan lebih dari yang diminta","Goes above and beyond","Mengambil tindakan yang melebihi persyaratan untuk mencapai sasaran.","Setelah target selesai, menambahkan analisis tren susut per penghantar yang tidak diminta tapi membantu sasaran unit."],
   ["Menyesuaikan interaksi antar pribadi","Responds interpersonal situations accordingly","Menyesuaikan gaya interpersonal untuk berinteraksi secara efektif dengan berbagai individu.","Berbicara teknis dan detail dengan engineer, tetapi sederhana dan to the point dengan mitra non-teknis."]
  ],
  star:["Ceritakan perubahan besar di pekerjaan Anda (sistem, struktur, teknologi, atasan) dan bagaimana Anda menyikapinya.",
        "Ceritakan saat Anda mengambil tindakan atau ide baru tanpa menunggu perintah.",
        "Ceritakan saat Anda harus menyesuaikan cara berkomunikasi dengan orang yang sangat berbeda gayanya."]},
 {id:"aj", name:"Analysis And Judgement", idn:"Analisis dan pengambilan keputusan", color:"#6b46c1",
  def:"Mengidentifikasi dan memahami isu, permasalahan, dan kesempatan; membandingkan data dari berbagai sumber untuk membuat kesimpulan; menggunakan pendekatan yang efektif untuk memilih tindakan atau mengembangkan solusi yang tepat.",
  kb:[
   ["Mengumpulkan informasi","Gathers information","Mengidentifikasi kebutuhan dan mengumpulkan informasi untuk memahami isu, permasalahan dan peluang dengan lebih baik.","Mengumpulkan data meter, beban, dan riwayat pemeliharaan sebelum membahas kenaikan susut."],
   ["Mengidentifikasi isu, permasalahan, dan kesempatan","Identifies issues, problems and opportunities","Mengenali isu, permasalahan, atau peluang dan menentukan apakah suatu tindakan perlu dilakukan.","Melihat lonjakan angka susut di dashboard dan memutuskan hal itu perlu ditindaklanjuti, bukan sekadar fluktuasi."],
   ["Menguraikan permasalahan yang kompleks","Outline the complex problem","Menguraikan masalah kompleks secara sistematis menjadi bagian yang mudah dipahami untuk menemukan akar penyebab.","Memecah masalah susut menjadi faktor teknis, akurasi meter, dan administrasi data untuk mencari akar penyebab."],
   ["Menghasilkan kesimpulan","Formulate conclusions","Membuat kesimpulan logis atas permasalahan atau menentukan tindakan sesuai level kewenangannya.","Menyimpulkan bahwa penyebab utama adalah CT meter yang drift, lalu mengajukan kalibrasi sesuai kewenangannya."],
   ["Mempertimbangkan berbagai sudut pandang","Consider various perspectives","Membahas masalah/peluang dari berbagai sudut pandang; mengembangkan alternatif solusi yang relevan.","Menyusun tiga alternatif solusi dan menilainya dari sisi biaya, risiko K3, dan dampak ke pelanggan."],
   ["Berkomitmen untuk bertindak","Commits to action","Melaksanakan keputusan atau mengambil tindakan sesuai waktu terbaik.","Menjadwalkan kalibrasi pada jam beban rendah minggu itu juga, tidak menunda sampai data \"sempurna\"."]
  ],
  star:["Ceritakan masalah kompleks yang Anda analisis sampai menemukan akar penyebabnya.",
        "Ceritakan keputusan penting yang Anda ambil saat data atau waktu terbatas.",
        "Ceritakan saat Anda menemukan peluang perbaikan dari data yang orang lain lewatkan."]},
 {id:"bt", name:"Building Trust", idn:"Membangun kepercayaan", color:"#1d7f48",
  def:"Berinteraksi dengan cara yang membuat orang lain merasa yakin atas tujuan individu maupun organisasi, menaati aturan serta peduli terhadap lingkungan sekitar.",
  kb:[
   ["Bekerja dengan integritas","Works with integrity","Jujur; menjaga komitmen; konsisten; bertanggung jawab atas hasil kerja; mengakui kesalahan; menaati peraturan perusahaan (K3LH, kepatuhan, disiplin, dll).","Mengakui salah input data ke atasan, segera mengirim koreksi, dan selalu memakai APD walau pekerjaan \"cuma sebentar\"."],
   ["Terbuka mengenai posisi diri sendiri","Shares disclosures","Menyampaikan pemikiran, perasaan dan alasan yang rasional sehingga orang lain memahami posisinya.","\"Saya keberatan dengan jadwal ini karena tim saya sedang menangani dua gangguan; ini alasan dan datanya.\""],
   ["Terbuka terhadap gagasan yang berbeda","Opens for different ideas","Mendengarkan dan secara objektif mempertimbangkan ide dan opini orang lain meskipun bertentangan.","Mendengarkan usulan junior yang berbeda dengan pendapatnya sampai selesai, lalu menimbangnya dengan data."],
   ["Mendukung orang lain","Supports others","Memperlakukan orang lain dengan martabat, hormat, dan adil; memberi penghargaan yang sesuai; membela yang berhak meski menghadapi tantangan.","Menyebut nama teknisi yang menemukan masalah di depan manajemen dan membelanya saat disalahkan tanpa dasar."],
   ["Tidak mengutamakan tujuan kelompok sendiri","Sets aside self-interest priorities","Menempatkan tujuan organisasi di atas tujuan kelompok sendiri; mengantisipasi dampak keputusan kelompok terhadap hubungan kemitraan.","Tetap mendahulukan pekerjaan pendukung unit lain meski KPI timnya sendiri jadi kurang menonjol bulan itu."],
   ["Menampilkan keteladanan","Being a model","Menampilkan contoh perilaku yang sesuai etika, standar dan nilai-nilai.","Selalu tepat waktu di apel K3, mengikuti SOP, dan menolak gratifikasi dari vendor."]
  ],
  star:["Ceritakan saat Anda melakukan kesalahan dalam pekerjaan dan bagaimana Anda menanganinya.",
        "Ceritakan saat Anda harus menegakkan aturan (misalnya K3 atau kepatuhan) walaupun tidak populer.",
        "Ceritakan saat Anda mendahulukan kepentingan perusahaan di atas kepentingan tim/pribadi."]},
 {id:"co", name:"Coaching", idn:"Membimbing", color:"#b83280",
  def:"Melibatkan individu dalam mengembangkan dan berkomitmen pada rencana tindakan untuk mengembangkan perilaku, keterampilan, atau pengetahuan spesifik yang dibutuhkan untuk meningkatkan kinerja atau menyiapkan tanggung jawab baru.",
  kb:[

async function genSJT(c,n=4){
  const j=await ask(`Kamu penyusun soal Situational Judgement Test untuk asesmen soft competency.
${brief(c)}
${CTX}

Buat ${n} soal BARU yang situasinya berbeda dari soal yang sudah ada:
${sjtPool(c).map(x=>"- "+x.q).join("\n")}

Aturan tiap soal:
- Situasi kerja realistis 1–3 kalimat, diakhiri pertanyaan seperti "Apa yang paling efektif?".
- Tepat 4 pilihan tindakan, semuanya masuk akal, panjangnya mirip. Pilihan terbaik TIDAK boleh selalu yang paling panjang atau selalu di posisi yang sama.
- Pilihan terbaik menunjukkan 1–3 key behavior kompetensi ini.
- "why": alasan singkat (maks. 20 kata) mengapa pilihan itu efektif atau kurang efektif.
- "urutan": indeks pilihan (0–3) dari paling efektif ke paling tidak efektif.
- "kb": nomor key behavior (1–6) yang ditunjukkan pilihan terbaik.
- Bahasa Indonesia baku yang ringkas.

Balas HANYA JSON valid:
{"soal":[{"q":"...","o":[{"t":"...","why":"..."},{"t":"...","why":"..."},{"t":"...","why":"..."},{"t":"...","why":"..."}],"urutan":[2,0,3,1],"kb":[1,4]}]}`);
  const out=(j.soal||[]).filter(x=>x&&x.q&&Array.isArray(x.o)&&x.o.length===4&&Array.isArray(x.urutan)&&x.urutan.map(Number).sort().join()==="0,1,2,3").map(x=>{
    const r=x.urutan.map(Number), k=(x.kb||[]).map(Number).filter(n=>n>=1&&n<=6);
    return {id:uid(),q:String(x.q),o:x.o.map(o=>[String(o.t??o),String(o.why??"")]),c:r[0],r,k:k.length?k:[1],ai:true}; });
  if(!out.length) throw new Error("empty");
  store.set(GKEY.sjt(c.id),store.get(GKEY.sjt(c.id),[]).concat(out)); return out.length;
}
async function genKB(c){
  const j=await ask(`Kamu penyusun soal latihan asesmen soft competency.
${brief(c)}
${CTX}

Buat 6 contoh perilaku BARU, satu untuk tiap key behavior (1–6). Tiap contoh 1–2 kalimat, konkret, menggambarkan tindakan nyata seseorang (boleh kutipan ucapan). Jangan menyebut nama key behavior-nya secara langsung. Hindari kemiripan dengan contoh yang sudah ada:
${kbPool(c).map(x=>"- "+x.ex).join("\n")}

Balas HANYA JSON valid: {"contoh":[{"kb":1,"ex":"..."}]}`);
  const out=(j.contoh||[]).filter(x=>x&&x.ex&&+x.kb>=1&&+x.kb<=6).map(x=>({id:uid(),kb:+x.kb-1,ex:String(x.ex),ai:true}));
  if(!out.length) throw new Error("empty");
  store.set(GKEY.kb(c.id),store.get(GKEY.kb(c.id),[]).concat(out)); return out.length;
}
async function genStar(c){

Buat 3 pertanyaan wawancara BARU yang menggali pengalaman nyata (diawali "Ceritakan…"), masing-masing menyasar key behavior yang berbeda. Jangan mirip dengan:
${starList(c).map(x=>"- "+x).join("\n")}

Balas HANYA JSON valid: {"pertanyaan":["...","...","..."]}`);
  const out=(j.pertanyaan||[]).map(String).filter(x=>x.length>15);
  if(!out.length) throw new Error("empty");
  store.set(GKEY.star(c.id),store.get(GKEY.star(c.id),[]).concat(out)); return out.length;
}

Balas HANYA JSON valid:

async function startQuiz(arg){
  const [kind,cid]=arg.split("-");
  const comps = cid==="all"?COMP:[C(cid)].filter(Boolean);
  if(!comps.length) return go("kasus");
  const per = kind==="kb"?6:4, need = cid==="all"?12:per;
  const title = kind==="sjt"?"Studi kasus":kind==="rank"?"Urutkan pilihan":"Kuis key behavior";
  const total=()=>comps.reduce((a,c)=>a+unseenOf(kind,c),0);
  let note="";
  if(total()<need){
    await waitSample();
    if(sample){
      const targets = cid==="all" ? comps.slice().sort((a,b)=>unseenOf(kind,a)-unseenOf(kind,b)).slice(0,3) : comps;
      $("#app").innerHTML=loadingView(title,"kasus","Membuat soal baru dengan AI…");
      try{ for(const c of targets){ if(kind==="kb") await genKB(c); else await genSJT(c,4); } note="Soal baru buatan AI sudah ditambahkan."; }
      catch(e){ note=errMsg(e)+" Untuk sementara soal lama diulang."; if(e&&e.code==="not_granted") sample=null; }
    } else note="Semua soal di sini sudah pernah dikerjakan, jadi soal diulang acak. Soal baru dibuat otomatis oleh AI saat halaman dibuka di claude.ai.";
  }
  const entries=[]; comps.forEach(c=>poolOf(kind,c).forEach(x=>entries.push({c,x})));
  const chosen=shuffle(shuffle(entries.filter(e=>!isSeen(kind,e.x.id))).concat(shuffle(entries.filter(e=>isSeen(kind,e.x.id)))).slice(0,need));
  const items=chosen.map(({c,x})=>{
    if(kind==="kb"){ const i=x.kb, others=shuffle(c.kb.map((_,j)=>j).filter(j=>j!==i)).slice(0,3);
      return {type:"kb",c,id:x.id,ai:x.ai,q:x.ex,opts:shuffle([i,...others].map(j=>({t:c.kb[j][0],why:c.kb[j][2],ok:j===i}))),k:[i+1]}; }
    if(kind==="rank") return {type:"rank",c,id:x.id,ai:x.ai,q:x.q,opts:shuffle(x.o.map((o,i)=>({t:o[0],why:o[1],ideal:x.r.indexOf(i)+1}))),k:x.k};
    return {type:"sjt",c,id:x.id,ai:x.ai,q:x.q,opts:shuffle(x.o.map((o,i)=>({t:o[0],why:o[1],ok:i===x.c}))),k:x.k};
  });
  Q={arg,kind,cid,items,i:0,score:0,max:0,answered:false,note};
  if(kind==="rank") renderRank(); else renderQuiz();
}
function qmeta(it){
  return `${Q.note&&Q.i===0?`<div class="notice" style="margin-bottom:12px">${esc(Q.note)}</div>`:""}<div class="qmeta"><span><span class="pill" style="background:${it.c.color}1a;color:${it.c.color}">${it.c.name}</span>${it.ai?' <span class="pill mid">Soal AI</span>':""}</span><span class="small muted">${Q.i+1} / ${Q.items.length}</span></div>`;
}
function renderQuiz(){
  const it=Q.items[Q.i], title=Q.kind==="sjt"?"Studi kasus":"Kuis key behavior";
  $("#app").innerHTML=topbar(title,"kasus")+`
   <div class="progress"><i style="width:${Q.i/Q.items.length*100}%"></i></div>

    <div id="qfb"></div>

}
function answerQuiz(j){
  const it=Q.items[Q.i]; const ok=it.opts[j].ok; if(ok) Q.score++; markSeen(Q.kind,it.id);
  document.querySelectorAll(".opt").forEach((b,x)=>{ b.disabled=true; b.querySelector(".why").classList.remove("hidden"); if(it.opts[x].ok) b.classList.add("correct"); else if(x===j) b.classList.add("wrong"); });
  const kbs=it.k.map(n=>`${n}. ${it.c.kb[n-1][0]}`).join(", ");
  $("#qfb").innerHTML=`<div class="fb ${ok?"ok":"bad"}"><b class="h">${ok?"Tepat!":"Kurang tepat"}</b>${Q.kind==="sjt"?`Key behavior yang ditunjukkan jawaban terbaik: <b>${kbs}</b>.`:`Jawabannya <b>${kbs}</b>: ${esc(it.c.kb[it.k[0]-1][2])}`}</div>`;
  $("#qnext").classList.remove("hidden");
  setTimeout(()=>{const n=$("#qnext"); if(n) n.scrollIntoView({behavior:"smooth",block:"nearest"});},50);

let ORDER=[];
function renderRank(){
  const it=Q.items[Q.i]; ORDER=[];
  $("#app").innerHTML=topbar("Urutkan pilihan","kasus")+`
   <div class="progress"><i style="width:${Q.i/Q.items.length*100}%"></i></div>
   <div class="card">
    ${qmeta(it)}
    <p class="small muted" style="margin:0 0 6px">Ketuk pilihan berurutan: <b>1 = paling efektif</b>, 4 = paling tidak efektif. Ketuk lagi untuk membatalkan.</p>
    <p class="qtext">${esc(it.q)}</p>
    <div class="opts" id="ropts"></div>
    <div id="qfb"></div>
   </div>
   <div class="row" id="rctl"><button class="btn ghost" id="rreset">Ulang urutan</button><button class="btn" id="rcheck" disabled>Cek urutan</button></div>
   <button class="btn hidden" id="qnext">${Q.i===Q.items.length-1?"Lihat hasil":"Lanjut"}</button>`;
  drawRank();
  $("#rreset").onclick=()=>{ORDER=[];drawRank();};
  $("#rcheck").onclick=checkRank;
  $("#qnext").onclick=()=>{ if(Q.i<Q.items.length-1){Q.i++;renderRank();window.scrollTo(0,0);} else quizResult(); };
}
function drawRank(done){
  const it=Q.items[Q.i];
  $("#ropts").innerHTML=it.opts.map((o,j)=>{ const r=ORDER.indexOf(j)+1;
    let res="";
    if(done){ const pts=3-Math.abs(r-o.ideal); res=`<div class="rres"><span>Urutanmu: ${r}</span><span>Ideal: ${o.ideal}</span><span class="pts pill ${pts===3?"ok":pts>=2?"mid":"bad"}">+${pts}</span></div><span class="why">${esc(o.why)}</span>`; }
    return `<button class="opt ${r?"ranked":""}" data-j="${j}" ${done?"disabled":""}><div class="ropt"><span class="rbadge">${r||""}</span><div style="flex:1">${esc(o.t)}${res}</div></div></button>`; }).join("");
  if(!done) document.querySelectorAll("#ropts .opt").forEach(b=>b.onclick=()=>{ const j=+b.dataset.j, x=ORDER.indexOf(j);
    if(x>=0) ORDER=ORDER.slice(0,x); else ORDER.push(j);
    if(ORDER.length===it.opts.length-1) ORDER.push(it.opts.findIndex((_,k)=>!ORDER.includes(k)));
    drawRank(); });
  const c=$("#rcheck"); if(c) c.disabled=ORDER.length<it.opts.length;
}
function checkRank(){
  const it=Q.items[Q.i];
  let pts=0; it.opts.forEach((o,j)=>pts+=3-Math.abs((ORDER.indexOf(j)+1)-o.ideal));
  const max=it.opts.length*3; Q.score+=pts; Q.max+=max; markSeen("rank",it.id);
  drawRank(true); $("#rctl").classList.add("hidden");
  const ideal=it.opts.map((o,j)=>({o,j})).sort((a,b)=>a.o.ideal-b.o.ideal);
  const kbs=it.k.map(n=>`${n}. ${it.c.kb[n-1][0]}`).join(", ");
  $("#qfb").innerHTML=`<div class="fb ${pts>=max*0.75?"ok":"bad"}"><b class="h">Skor ${pts} / ${max}</b>
    Urutan ideal:<ol style="margin:6px 0 8px;padding-left:20px">${ideal.map(x=>`<li>${esc(x.o.t)}</li>`).join("")}</ol>
    Key behavior pada pilihan terbaik: <b>${kbs}</b>.<br><span class="small muted">Tiap pilihan bernilai 3 jika posisinya tepat, berkurang 1 untuk setiap selisih posisi.</span></div>`;
  $("#qnext").classList.remove("hidden");
  setTimeout(()=>{const n=$("#qfb"); if(n) n.scrollIntoView({behavior:"smooth",block:"start"});},50);
}
function quizResult(){
  if(Q.kind==="rank"){
    const pct=Math.round(Q.score/Q.max*100);
    if(Q.cid!=="all"){ if(P.rank[Q.cid]==null||pct>P.rank[Q.cid]) P.rank[Q.cid]=pct; save(); }
    $("#app").innerHTML=topbar("Hasil","kasus")+`<div class="card" style="text-align:center;padding:26px 18px">
      <div style="font-size:46px;font-weight:800;letter-spacing:-.03em">${pct}%</div>
      <p class="muted" style="margin:4px 0 4px">${Q.score} dari ${Q.max} poin</p>
      <p class="muted" style="margin:6px 0 18px">${pct>=85?"Sangat baik. Penilaianmu sejalan dengan urutan ideal.":pct>=70?"Bagus. Perhatikan pilihan yang posisinya meleset jauh.":"Coba baca lagi penjelasan tiap pilihan dan key behavior-nya."}</p>

      <button class="btn ghost" onclick="go('kasus')">Pilih latihan lain</button></div>`;
    return;
  }

  if(Q.cid!=="all"){ const bucket=Q.kind==="sjt"?P.sjt:P.kb; if(bucket[Q.cid]==null||pct>bucket[Q.cid]) bucket[Q.cid]=pct; save(); }
  $("#app").innerHTML=topbar("Hasil","kasus")+`<div class="card" style="text-align:center;padding:26px 18px">
    <div style="font-size:46px;font-weight:800;letter-spacing:-.03em">${Q.score}<span style="font-size:20px;color:var(--muted)"> / ${Q.items.length}</span></div>
    <p class="muted" style="margin:6px 0 18px">${pct===100?"Sempurna!":pct>=75?"Bagus. Tinggal sedikit lagi.":pct>=50?"Lumayan. Baca lagi materi key behavior-nya.":"Pelajari materinya dulu, lalu coba lagi."}</p>
    <button class="btn" style="margin-bottom:8px" onclick="startQuiz('${Q.arg}')">Ulangi</button>
    ${Q.cid!=="all"?`<button class="btn ghost" style="margin-bottom:8px" onclick="go('materi-${Q.cid}')">Baca materi</button>`:""}
    <button class="btn ghost" onclick="go('kasus')">Pilih latihan lain</button></div>`;
}

    : `<button class="btn" id="selfBtn">Nilai sendiri dengan checklist</button><p class="small muted" style="margin:8px 0 0;text-align:center">Penilaian AI hanya tersedia saat halaman dibuka di claude.ai.</p>`;
  if(sample) $("#evalBtn").onclick=()=>evalStar(c,list[qi],qi);

    const run=async()=>{ const b=$("#genStarBtn"); if(!b) return; b.disabled=true; b.innerHTML=`<span class="spinner dark"></span>Membuat pertanyaan…`;
      try{ const before=starList(c).length; await genStar(c); starQ[id]=before; starView(id); }

function field(k,L,name,hint,val,rows){ return `<div class="field"><label><span class="letter">${L}</span>${name} <span>${hint}</span></label><textarea id="f_${k}" rows="${rows}">${esc(val)}</textarea></div>`; }
function getStar(){ return {s:$("#f_s").value.trim(),t:$("#f_t").value.trim(),a:$("#f_a").value.trim(),r:$("#f_r").value.trim()}; }
function kbList(c){ return c.kb.map((k,i)=>`${i+1}. ${k[0]} (${k[1]}): ${k[2]}`).join("\n"); }
function parseJSON(t){ const m=String(t).match(/\{[\s\S]*\}/); if(!m) throw new Error("no json"); return JSON.parse(m[0]); }

async function evalStar(c,question,qi){
  const st=getStar();
  if((st.a+st.s).length<40){ $("#evalOut").innerHTML=`<div class="notice">Ceritakan lebih lengkap dulu, terutama bagian Situasi dan Aksi.</div>`; return; }
  const btn=$("#evalBtn"); btn.disabled=true; btn.innerHTML=`<span class="spinner"></span>Menilai…`;
  const prompt=`Kamu adalah asesor kompetensi berpengalaman yang memakai metode Behavioral Event Interview. Nilai jawaban peserta untuk kompetensi berikut.

KOMPETENSI: ${c.name}
DEFINISI: ${c.def}
KEY BEHAVIOR:
${kbList(c)}

PERTANYAAN: ${question}
JAWABAN PESERTA (format STAR):
Situasi: ${st.s||"-"}
Tugas: ${st.t||"-"}
Aksi: ${st.a||"-"}
Hasil: ${st.r||"-"}

Aturan penilaian:
- Nilai hanya perilaku nyata yang benar-benar dilakukan peserta di masa lalu (kata "saya"), bukan rencana, opini, atau apa yang dilakukan tim.
- Jawaban yang umum atau hipotetis ("biasanya saya…") dinilai lemah.
- Skala skor 1–5: 1 = hampir tidak ada bukti, 2 = bukti lemah, 3 = memenuhi, 4 = kuat, 5 = sangat kuat dan bisa jadi teladan.
- Status per key behavior: "kuat", "sebagian", atau "belum".
- Gunakan bahasa Indonesia yang ringkas dan langsung.

Balas HANYA dengan JSON valid, tanpa teks lain:
{"skor":3,"ringkasan":"1-2 kalimat","kb":[{"no":1,"status":"kuat|sebagian|belum","catatan":"bukti singkat atau apa yang kurang"}],"kekuatan":["..."],"perbaikan":["saran konkret untuk memperkuat jawaban"],"pertanyaan_lanjutan":["pertanyaan probing yang mungkin diajukan asesor"]}
Isi kb untuk keenam key behavior (no 1-6).`;
  try{
    const res=await sample(prompt,{modelTier:"default"});
    const j=parseJSON(res.text);
    P.star[c.id]=(P.star[c.id]||0)+1; save();
    const d=store.get("sc_stardone_"+c.id,[]); if(!d.includes(qi)){ d.push(qi); store.set("sc_stardone_"+c.id,d); }

    $("#evalOut").innerHTML=`<div class="notice">${e&&e.code==="rate_limited"?"Terlalu banyak permintaan. Tunggu sebentar lalu coba lagi.":e&&e.code==="not_granted"?"Akses AI tidak diizinkan. Gunakan checklist mandiri.":"Penilaian gagal. Coba lagi sebentar lagi."}</div>`;
    if(e&&e.code==="not_granted"){ sample=null; }
  }
  btn.disabled=false; btn.textContent="Nilai ulang dengan AI";
}

async function sendSim(){
  const v=$("#simIn").value.trim(); if(!v||SIM.busy) return;
  SIM.msgs.push({role:"user",content:v}); SIM.busy=true; drawChat(); drawCtl();
  const r=RP[SIM.i];
  const conv=[{role:"user",content:personaPrompt(r)+"\n\n(Mulai.)"}, ...SIM.msgs];
  try{
    let live=null;
    const res=await sample(conv,{cache:false,modelTier:"default",onText:({text})=>{ live=text; const last=$("#chat").lastElementChild; if(last&&text&&text!=="Thinking...") last.innerHTML=`<span class="who">${esc(r.who)}</span>${esc(text)}`; }});

    SIM.msgs.pop(); $("#evalOut").innerHTML=`<div class="notice" style="margin-top:10px">${e&&e.code==="rate_limited"?"Terlalu banyak permintaan, tunggu sebentar.":"Gagal mendapat jawaban. Coba kirim lagi."}</div>`;
    setTimeout(()=>{ if($("#simIn")) $("#simIn").value=v; },0);
  }

}
async function evalSim(){

  SIM.busy=true; drawCtl(); $("#simEnd").innerHTML=`<span class="spinner dark"></span>Menilai…`;
  const transcript=SIM.msgs.map(m=>`${m.role==="assistant"?r.who:"Peserta"}: ${m.content}`).join("\n");

${kbList(c)}

TRANSKRIP:
${transcript}

Balas HANYA dengan JSON valid:
{"skor":3,"ringkasan":"1-2 kalimat","kb":[{"no":1,"status":"kuat|sebagian|belum","catatan":"..."}],"kekuatan":["..."],"perbaikan":["..."],"pertanyaan_lanjutan":[]}
Isi kb untuk keenam key behavior (no 1-6).`;
  try{

    P.rp[c.id]=(P.rp[c.id]||0)+1; save();
    const rd=store.get("sc_rpdone",[]); if(!rd.includes(SIM.i)){ rd.push(SIM.i); store.set("sc_rpdone",rd); }

const rint=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pickR=a=>a[Math.floor(Math.random()*a.length)];
const fmt=n=>{ const s=(Math.round(n*100)/100).toString().split("."); return s[0].replace(/\B(?=(\d{3})+(?!\d))/g,".")+(s[1]?","+s[1]:""); };
function numOpts(ans,cands){ const out=[ans]; for(const c of shuffle(cands)){ if(out.length>=4) break; if(Number.isFinite(c)&&!out.includes(c)) out.push(c); }
  let k=1; while(out.length<4){ const c=ans+k*(k%2?1:-1)*rint(1,3); if(!out.includes(c)) out.push(c); k++; } return out; }

const norm=cs=>{ const mx=Math.min(...cs.map(c=>c[0])), my=Math.min(...cs.map(c=>c[1])); return cs.map(([x,y])=>[x-mx,y-my]).sort((a,b)=>a[0]-b[0]||a[1]-b[1]); };
const key=cs=>norm(cs).map(c=>c.join(",")).join(";");
const cw=cs=>norm(cs.map(([x,y])=>[-y,x]));
const ccw=cs=>norm(cs.map(([x,y])=>[y,-x]));
const mir=cs=>norm(cs.map(([x,y])=>[-x,y]));
const rotN=(cs,n)=>{ let r=norm(cs); for(let i=0;i<((n%4)+4)%4;i++) r=cw(r); return r; };
function polyomino(){
  for(let t=0;t<500;t++){
    const n=rint(5,6), cells=[[0,0]];
    while(cells.length<n){ const [x,y]=pickR(cells), [dx,dy]=pickR([[1,0],[-1,0],[0,1],[0,-1]]), c=[x+dx,y+dy];
      if(!cells.some(e=>e[0]===c[0]&&e[1]===c[1])) cells.push(c); }
    const s=norm(cells), rots=[0,1,2,3].map(k=>key(rotN(s,k))), mk=[0,1,2,3].map(k=>key(rotN(mir(s),k)));
    if(Math.max(...s.map(c=>c[0]))>3||Math.max(...s.map(c=>c[1]))>3) continue;
    if(new Set(rots).size===4 && !mk.some(m=>rots.includes(m))) return s;
  }
  return norm([[0,0],[1,0],[2,0],[2,1],[0,1],[0,2]]);
}
function polySVG(cs,size=86){
  const w=Math.max(...cs.map(c=>c[0]))+1, h=Math.max(...cs.map(c=>c[1]))+1, u=Math.floor((size-10)/4), ox=(size-w*u)/2, oy=(size-h*u)/2;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${cs.map(([x,y])=>`<rect x="${ox+x*u}" y="${oy+y*u}" width="${u}" height="${u}" rx="2" fill="#0f5e57" stroke="#fff" stroke-width="2"/>`).join("")}</svg>`;
}
const FLAG=`<path d="M0,-30 L13,-12 L5,-12 L5,26 L-5,26 L-5,-12 L-13,-12 Z" fill="#0f5e57"/><rect x="5" y="2" width="15" height="10" rx="1.5" fill="#c8661b"/><circle cx="-1" cy="-20" r="0" />`;
const flagSVG=(ang,flip,size=86)=>`<svg width="${size}" height="${size}" viewBox="-43 -43 86 86"><circle r="40" fill="#f2f5f2"/><g transform="rotate(${ang}) scale(${flip?-1:1},1)">${FLAG}</g></svg>`;

function genFigure(){
  const t=pickR(["sama","putar","deret"]);
  if(t==="sama"){
    const s=polyomino(), k=rint(1,3), ok=rotN(s,k), m=shuffle([0,1,2,3]).slice(0,3).map(j=>rotN(mir(s),j));
    const opts=shuffle([{h:polySVG(ok),ok:true},...m.map(x=>({h:polySVG(x),ok:false}))]);
    return {cat:"gambar",sub:"Rotasi bangun",q:"Gambar mana yang sama dengan gambar soal jika hanya <b>diputar</b> (tidak dibalik/dicerminkan)?",fig:polySVG(s,110),opts,
      ex:`Jawaban benar adalah gambar soal yang diputar ${k*90}° searah jarum jam. Tiga pilihan lain adalah bayangan cermin (dibalik), sehingga tidak bisa didapat hanya dengan memutar.`};
  }
  if(t==="putar"){
    const s=polyomino(), dir=pickR(["searah","berlawanan arah"]), good=dir==="searah"?cw(s):ccw(s), wrong=dir==="searah"?ccw(s):cw(s);
    const opts=shuffle([{h:polySVG(good),ok:true},{h:polySVG(wrong),ok:false},{h:polySVG(rotN(s,2)),ok:false},{h:polySVG(mir(good)),ok:false}]);
    return {cat:"gambar",sub:"Putar 90°",q:`Jika gambar soal diputar <b>90° ${dir} jarum jam</b>, hasilnya adalah…`,fig:polySVG(s,110),opts,
      ex:`Bayangkan bagian paling atas gambar: diputar 90° ${dir} jarum jam, bagian itu pindah ke sisi ${dir==="searah"?"kanan":"kiri"}. Pilihan lain adalah putaran ke arah sebaliknya, putaran 180°, atau gambar yang dicerminkan.`};
  }
  const step=pickR([45,90,135])*pickR([1,-1]), a0=pickR([0,45,90,180,270]), ans=a0+3*step;
  const opts=shuffle([{h:flagSVG(ans,false),ok:true},{h:flagSVG(ans+step,false),ok:false},{h:flagSVG(ans-2*step,false),ok:false},{h:flagSVG(ans,true),ok:false}]);
  return {cat:"gambar",sub:"Deret putaran",q:"Gambar berikut berputar dengan pola tetap. Gambar berikutnya adalah…",
    fig:`<div style="display:flex;gap:6px;align-items:center;justify-content:center">${[0,1,2].map(i=>flagSVG(a0+i*step,false,74)).join("")}<div style="width:74px;height:74px;border:2px dashed #c9cfc9;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#9aa39e;font-size:22px">?</div></div>`,opts,
    ex:`Setiap langkah gambar berputar ${Math.abs(step)}° ${step>0?"searah":"berlawanan arah"} jarum jam. Perhatikan juga bendera oranye: pilihan yang benderanya pindah sisi adalah gambar yang dicerminkan.`};
}

function genSeries(){
  const t=pickR(["arit","bertingkat","geo","seling","kali","kuadrat","fibo"]);
  let seq,ans,ex,c=[];
  if(t==="arit"){ const a=rint(2,60), d=pickR([1,-1])*rint(3,14); seq=[0,1,2,3,4].map(i=>a+i*d); if(seq.some(x=>x<0)) return genSeries(); ans=a+5*d; ex=`Setiap suku ${d>0?"ditambah":"dikurangi"} ${Math.abs(d)}.`; c=[ans+d,ans-d,ans+1,ans-2]; }
  if(t==="bertingkat"){ const a=rint(1,20), d=rint(1,5), inc=rint(1,4); seq=[a]; let dd=d; for(let i=0;i<4;i++){ seq.push(seq[i]+dd); dd+=inc; } ans=seq[4]+dd; ex=`Selisihnya bertambah ${inc} setiap langkah: ${[0,1,2,3].map(i=>"+"+(d+i*inc)).join(", ")}, lalu +${dd}.`; c=[ans-inc,ans+inc,seq[4]+dd-1+inc*2,ans+1]; }
  if(t==="geo"){ const a=rint(1,6), r=pickR([2,3]); seq=[0,1,2,3,4].map(i=>a*r**i); ans=a*r**5; ex=`Setiap suku dikali ${r}.`; c=[seq[4]+(seq[4]-seq[3]),ans+r,ans-a*r,ans*r/ (r===2?1.5:2)]; }
  if(t==="seling"){ const a=rint(2,20), p=rint(2,9), b=rint(10,40), q=pickR([1,-1])*rint(2,6); seq=[]; for(let i=0;i<7;i++) seq.push(i%2===0? a+(i/2)*p : b+((i-1)/2)*q); if(seq.some(x=>x<0)) return genSeries(); ans=b+3*q; ex=`Ada dua deret yang berselang-seling. Suku ganjil: ${a}, ${a+p}, … (+${p}). Suku genap: ${b}, ${b+q}, … (${q>0?"+":""}${q}). Suku ke-8 masuk deret genap.`; c=[a+4*p,ans+q,ans-q,seq[6]+p]; }
  if(t==="kali"){ const a=rint(1,6), m=pickR([2,3]), k=pickR([-1,1,2]); seq=[a]; for(let i=0;i<4;i++) seq.push(seq[i]*m+k); ans=seq[4]*m+k; ex=`Setiap suku dikali ${m} lalu ${k>0?"ditambah":"dikurangi"} ${Math.abs(k)}.`; c=[seq[4]*m,ans+k*2,seq[4]*m-k,ans+m]; }
  if(t==="kuadrat"){ const s=rint(1,6), k=pickR([0,1,-1,2,3]); seq=[0,1,2,3,4].map(i=>(s+i)**2+k); ans=(s+5)**2+k; ex=`Polanya bilangan kuadrat ${k?(k>0?"ditambah "+k:"dikurangi "+(-k)):""}: ${s}², ${s+1}², ${s+2}², … sehingga berikutnya ${s+5}²${k?(k>0?" + "+k:" − "+(-k)):""}.`; c=[ans+1,ans-(2*(s+5)-1),ans+2*(s+5)+1,ans-2]; }
  if(t==="fibo"){ const a=rint(1,6), b=rint(2,9); seq=[a,b]; for(let i=0;i<4;i++) seq.push(seq[i]+seq[i+1]); ans=seq[4]+seq[5]; ex="Setiap suku adalah jumlah dua suku sebelumnya."; c=[ans+1,ans-seq[4]+seq[3],seq[5]*2,ans-1]; }
  return {cat:"angka",sub:"Deret angka",q:`Lanjutkan deret berikut:<div class="series">${seq.map(fmt).join(", ")}, <b>…</b></div>`,opts:numOpts(ans,c.map(Math.round)).map(v=>({h:fmt(v),ok:v===ans})),ex};
}
function genArith(){
  const t=pickR(["persen","susut","pecahan","persamaan","jarak","kerja","rasio"]);
  let q,ans,ex,c;
  if(t==="persen"){ const p=pickR([5,10,12,15,20,25,30,40,60,75]), n=rint(4,60)*20; ans=p*n/100; q=`Berapa ${p}% dari ${fmt(n)}?`; ex=`${p}% × ${fmt(n)} = ${fmt(n)} × ${p}/100 = ${fmt(ans)}.`; c=[ans*2,ans/2,ans+n/10,ans-p]; }
  if(t==="susut"){ const s=pickR([1.5,2,2.5,3,4,5]), e=rint(10,60)*200; const terima=e*(1-s/100); ans=s; q=`Energi yang dikirim ${fmt(e)} MWh dan energi yang diterima ${fmt(terima)} MWh. Berapa persen susutnya?`; ex=`Susut = (${fmt(e)} − ${fmt(terima)}) / ${fmt(e)} × 100% = ${fmt(e-terima)} / ${fmt(e)} × 100% = ${fmt(s)}%.`;
    return {cat:"angka",sub:"Hitungan",q,opts:shuffle([s,...shuffle([1,1.5,2,2.5,3,3.5,4,4.5,5,6].filter(x=>x!==s)).slice(0,3)]).map(v=>({h:fmt(v)+"%",ok:v===s})),ex}; }

  if(t==="persamaan"){ const x=rint(2,15), a=rint(2,9), b=rint(1,30), r=a*x+b; ans=x; q=`Jika ${a}x + ${b} = ${r}, berapakah x?`; ex=`${a}x = ${r} − ${b} = ${r-b}, maka x = ${r-b} : ${a} = ${x}.`; c=[x+1,x-1,Math.round(r/a),x+2]; }
  if(t==="jarak"){ const v=pickR([40,45,50,60,75,80]), tm=pickR([1.5,2,2.5,3,4]); ans=v*tm; q=`Mobil patroli jaringan melaju rata-rata ${v} km/jam selama ${fmt(tm)} jam. Berapa km jarak yang ditempuh?`; ex=`Jarak = kecepatan × waktu = ${v} × ${fmt(tm)} = ${fmt(ans)} km.`; c=[ans+v/2,ans-v/2,v*Math.floor(tm),ans+10]; }
  if(t==="kerja"){ const [x,y,z]=pickR([[3,6,2],[4,12,3],[6,12,4],[10,15,6],[12,24,8],[20,30,12],[6,3,2]]); ans=z; q=`Tim A dapat menyelesaikan pemeliharaan dalam ${x} hari, tim B dalam ${y} hari. Jika bekerja bersama, berapa hari pekerjaan selesai?`; ex=`Dalam sehari: 1/${x} + 1/${y} = 1/${z}. Jadi bersama-sama selesai dalam ${z} hari.`; c=[(x+y)/2,Math.min(x,y)-1,z+1,z+2].map(Math.round); }
  if(t==="rasio"){ const a=rint(2,5), b=rint(2,7); if(a===b) return genArith(); const k=rint(3,12), tot=(a+b)*k; ans=a*k; q=`Perbandingan pegawai laki-laki dan perempuan di sebuah unit ${a} : ${b}. Jika jumlah seluruh pegawai ${tot} orang, berapa pegawai laki-laki?`; ex=`Laki-laki = ${a}/(${a}+${b}) × ${tot} = ${a}/${a+b} × ${tot} = ${ans}.`; c=[b*k,ans+k,ans-k,tot/2]; }
  return {cat:"angka",sub:"Hitungan",q,opts:numOpts(ans,c.map(v=>Math.round(v*100)/100)).map(v=>({h:fmt(v),ok:v===ans})),ex};
}

function genSeating(){
  for(let t=0;t<200;t++){
    const nm=shuffle(NAMES).slice(0,5), truth=shuffle([0,1,2,3,4]); // truth[pos]=person index
    const pos=i=>truth.indexOf(i), N=i=>nm[i];
    const mk=[];
    const pairs=[]; for(let a=0;a<5;a++) for(let b=0;b<5;b++) if(a!==b) pairs.push([a,b]);
    shuffle(pairs).forEach(([a,b])=>{
      const pa=pos(a), pb=pos(b);
      if(pa===pb+1) mk.push({t:`${N(a)} duduk tepat di sebelah kanan ${N(b)}.`,f:p=>p.indexOf(a)===p.indexOf(b)+1});
      else if(pa<pb && pb-pa>1) mk.push({t:`${N(a)} duduk di sebelah kiri ${N(b)}, tetapi tidak bersebelahan.`,f:p=>p.indexOf(a)<p.indexOf(b)&&p.indexOf(b)-p.indexOf(a)>1});
      if(Math.abs(pa-pb)===2 && a<b) mk.push({t:`Di antara ${N(a)} dan ${N(b)} ada tepat satu orang.`,f:p=>Math.abs(p.indexOf(a)-p.indexOf(b))===2});
      if(Math.abs(pa-pb)>1 && a<b) mk.push({t:`${N(a)} tidak duduk bersebelahan dengan ${N(b)}.`,f:p=>Math.abs(p.indexOf(a)-p.indexOf(b))>1});
    });
    const ends=[]; if(true){ const e=pickR([0,4,2]); const who=truth[e]; ends.push({t:e===2?`${N(who)} duduk tepat di tengah.`:`${N(who)} duduk paling ${e===0?"kiri":"kanan"}.`,f:p=>p[e]===who}); }
    const clues=[...ends]; let sols=PERMS5;
    for(const c of shuffle(mk)){ if(sols.length===1) break; const ns=sols.filter(c.f); if(ns.length<sols.length){ clues.push(c); sols=ns; } }
    sols=sols.filter(p=>clues.every(c=>c.f(p)));
    if(sols.length!==1||clues.length>6) continue;
    const order=truth.map(N).join(" – ");
    let q,ans;
    if(Math.random()<.5){ const k=rint(0,4); q=`Siapa yang duduk di posisi ke-${k+1} dari kiri?`; ans=N(truth[k]); }
    else { const k=rint(0,3); q=`Siapa yang duduk tepat di sebelah kanan ${N(truth[k])}?`; ans=N(truth[k+1]); }
    return {cat:"cerita",sub:"Urutan duduk",tmul:3,passage:`Lima pegawai, yaitu ${nm.slice().sort().join(", ")}, duduk berderet dalam satu baris menghadap ke depan.<ul class="clues">${shuffle(clues).map(c=>`<li>${c.t}</li>`).join("")}</ul>`,
      q,opts:nameOpts(ans,nm),ex:`Susunan dari kiri ke kanan: ${order}. Kerjakan dari petunjuk yang paling pasti dulu (posisi ujung/tengah), lalu petunjuk "tepat di sebelah".`};
  }

}

function genCompare(){

    const perms=PERMS5.filter(p=>p.length===5).map(p=>p.filter(x=>x<n)).filter((p,i,arr)=>arr.findIndex(q=>q.join()===p.join())===i);
    let sols=perms, clues=[];

  }

}

  angka:{name:"Angka",desc:"Deret angka dan hitungan (persen, susut, pecahan, persamaan, soal cerita)",gen:()=>Math.random()<.5?genSeries():genArith(),color:"#2b6cb0"},
  bahasa:{name:"Bahasa",desc:"Sinonim, antonim, dan analogi",gen:genVerbal,color:"#b83280"},
  cerita:{name:"Cerita & penalaran",desc:"Urutan duduk, perbandingan, penarikan kesimpulan, pemahaman bacaan",gen:genCerita,color:"#6b46c1"},
  campur:{name:"Campuran",desc:"Gabungan semua jenis, seperti tes sebenarnya",gen:()=>pickR([genFigure,genSeries,genArith,genVerbal,genCerita])(),color:"#c8661b"}};
let PT={n:10,timer:30}, PS=null;
function psikoMenu(){
  const best=store.get("sc_psiko",{});
  return topbar("Psikotes")+`<p class="small muted" style="margin:-4px 2px 14px">Soal gambar, angka, urutan duduk, perbandingan, dan penarikan kesimpulan dibuat acak oleh program, jadi tidak pernah habis. Soal bahasa dan bacaan ditambah AI kalau hampir habis. Batas waktu soal cerita otomatis lebih panjang.</p>
  <div class="card"><p class="label">Pengaturan</p>
   <div class="small" style="font-weight:700;margin-bottom:6px">Jumlah soal</div>
   <div class="seg" id="pN">${[10,20,30].map(n=>`<button class="${PT.n===n?"on":""}" data-v="${n}">${n}</button>`).join("")}</div>
   <div class="small" style="font-weight:700;margin-bottom:6px">Batas waktu per soal</div>
   <div class="seg" id="pT" style="margin-bottom:0">${[[0,"Bebas"],[20,"20 detik"],[30,"30 detik"],[45,"45 detik"]].map(([v,l])=>`<button class="${PT.timer===v?"on":""}" data-v="${v}">${l}</button>`).join("")}</div>
  </div>
  ${Object.entries(PCAT).map(([k,c])=>`<button class="comp" onclick="startPsiko('${k}')"><span class="ic" style="background:${c.color}1a;color:${c.color}">${k==="gambar"?"↻":k==="angka"?"123":k==="bahasa"?"Aa":k==="cerita"?"¶":"★"}</span><span class="tx"><div class="nm">${c.name}</div><div class="sb">${c.desc}${best[k]!=null?` · terbaik ${best[k]}%`:""}</div></span><span class="muted">›</span></button>`).join("")}`;
}
function bindPsikoMenu(){
  [["#pN","n"],["#pT","timer"]].forEach(([sel,k])=>document.querySelectorAll(sel+" button").forEach(b=>b.onclick=()=>{ PT[k]=+b.dataset.v; document.querySelectorAll(sel+" button").forEach(x=>x.classList.toggle("on",x===b)); }));
}
async function startPsiko(cat){
  if(cat==="bahasa"||cat==="cerita"||cat==="campur"){ await waitSample(); if(sample){ $("#app").innerHTML=loadingView("Psikotes","tes","Menyiapkan soal…"); try{ if(cat!=="cerita") await topUpVerbal(); if(cat!=="bahasa") await topUpBacaan(); }catch(e){} } }
  const items=[]; for(let i=0;i<PT.n;i++){ let it; let tries=0; const sig=x=>x.q+(x.fig||"")+x.opts.map(o=>o.h).join("|"); do{ it=PCAT[cat].gen(); tries++; }while(tries<30&&items.some(x=>sig(x)===sig(it))); items.push(it); }
  PS={cat,items,i:0,res:[],t0:Date.now(),timer:PT.timer,tick:null};
  renderPsiko();
}
function renderPsiko(){
  clearInterval(PS.tick);
  const it=PS.items[PS.i];
  $("#app").innerHTML=topbar("Psikotes · "+PCAT[PS.cat].name,"tes")+`
   <div class="progress"><i style="width:${PS.i/PS.items.length*100}%"></i></div>
   <div class="card">
    <div class="qmeta"><span class="pill">${it.sub}</span><span class="small muted">${PS.i+1} / ${PS.items.length}${PS.timer?` · <b id="pclock">${Math.round(PS.timer*(it.tmul||1))}</b> dtk`:""}</span></div>
    ${PS.timer?`<div class="tbar"><i id="tfill"></i></div>`:""}
    ${it.passage?`<div class="passage">${it.passage}</div>`:""}
    <div class="qtext">${it.q}</div>
    ${it.fig?`<div class="figq">${it.fig}</div>`:""}
    <div class="${it.cat==="gambar"?"fopts":"opts"}">${it.opts.map((o,j)=>`<button class="opt ${it.cat==="gambar"?"fopt":""}" data-j="${j}">${it.cat==="gambar"?`<span class="flab">${"ABCD"[j]}</span>`:""}${o.h}</button>`).join("")}</div>
    <div id="pfb"></div>
   </div>
   <button class="btn hidden" id="pnext">${PS.i===PS.items.length-1?"Lihat hasil":"Lanjut"}</button>`;
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answerPsiko(+b.dataset.j));
  $("#pnext").onclick=()=>{ if(PS.i<PS.items.length-1){ PS.i++; renderPsiko(); window.scrollTo(0,0);} else psikoResult(); };
  PS.qStart=Date.now(); PS.done=false;
  const lim=PS.timer*(it.tmul||1);
  if(PS.timer){ PS.tick=setInterval(()=>{ const left=Math.max(0,lim-(Date.now()-PS.qStart)/1000); const c=$("#pclock"), f=$("#tfill");
    if(!c){ clearInterval(PS.tick); return; } c.textContent=Math.ceil(left); f.style.width=(left/lim*100)+"%"; f.style.background=left<6?"var(--bad)":"var(--accent)";
    if(left<=0){ clearInterval(PS.tick); answerPsiko(-1); } },200); }
}
function answerPsiko(j){
  if(PS.done) return; PS.done=true; clearInterval(PS.tick);
  const it=PS.items[PS.i], ok=j>=0&&it.opts[j].ok, sec=(Date.now()-PS.qStart)/1000;
  PS.res.push({ok,sub:it.sub,sec,timeout:j<0});
  document.querySelectorAll(".opt").forEach((b,x)=>{ b.disabled=true; if(it.opts[x].ok) b.classList.add("correct"); else if(x===j) b.classList.add("wrong"); });
  $("#pfb").innerHTML=`<div class="fb ${ok?"ok":"bad"}"><b class="h">${ok?"Benar!":j<0?"Waktu habis":"Kurang tepat"}</b>${esc(it.ex)}</div>`;
  $("#pnext").classList.remove("hidden");
  setTimeout(()=>{const n=$("#pnext"); if(n) n.scrollIntoView({behavior:"smooth",block:"nearest"});},50);
}
function psikoResult(){
  clearInterval(PS.tick);
  const n=PS.res.length, ok=PS.res.filter(r=>r.ok).length, pct=Math.round(ok/n*100), avg=PS.res.reduce((a,r)=>a+r.sec,0)/n;
  const best=store.get("sc_psiko",{}); if(best[PS.cat]==null||pct>best[PS.cat]){ best[PS.cat]=pct; store.set("sc_psiko",best); }
  const by={}; PS.res.forEach(r=>{ by[r.sub]=by[r.sub]||{ok:0,n:0}; by[r.sub].n++; if(r.ok) by[r.sub].ok++; });
  $("#app").innerHTML=topbar("Hasil psikotes","tes")+`<div class="card" style="text-align:center;padding:24px 18px">
    <div style="font-size:46px;font-weight:800;letter-spacing:-.03em">${ok}<span style="font-size:20px;color:var(--muted)"> / ${n}</span></div>
    <p class="muted" style="margin:4px 0 0">Rata-rata ${fmt(Math.round(avg*10)/10)} detik per soal${PS.res.some(r=>r.timeout)?` · ${PS.res.filter(r=>r.timeout).length} soal waktu habis`:""}</p></div>
   <div class="card"><p class="label">Per jenis soal</p>${Object.entries(by).map(([k,v])=>`<div style="display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid var(--line);font-size:14px"><span>${k}</span><b>${v.ok} / ${v.n}</b></div>`).join("")}</div>
   <button class="btn" style="margin-bottom:8px" onclick="startPsiko('${PS.cat}')">Soal baru</button>
   <button class="btn ghost" onclick="go('tes')">Pilih jenis lain</button>`;
}

render();
</script>
</body>
</html>
